name: JARVIS paper trader
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: jarvis-paper-trader
  cancel-in-progress: false
jobs:
  paper-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate scheduler secret
        env:
          JARVIS_CRON_SECRET: ${{ secrets.JARVIS_CRON_SECRET }}
        run: |
          if [ -z "$JARVIS_CRON_SECRET" ]; then
            echo "::error::Add Actions secret JARVIS_CRON_SECRET matching Vercel CRON_SECRET."
            exit 1
          fi
      - name: Run paper-only strategy cycle
        env:
          JARVIS_CRON_SECRET: ${{ secrets.JARVIS_CRON_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${JARVIS_CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://jarvis-ai-factory.vercel.app/api/cron/paper-trader")"
          echo "$response"
          printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
